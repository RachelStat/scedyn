[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scedyn"
dynamic = ["version"]
description = "Self-consistent estimation with neural encoders for dynamic survival prediction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Qiurui Du" },
    { name = "Sehwan Kim" },
    { name = "Rui Wang" },
    { name = "Wenbin Lu" },
]
keywords = ["survival analysis", "dynamic prediction", "landmarking", "deep learning", "self-consistency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/ReneeQRDu/scedyn"
Documentation = "https://scedyn.readthedocs.io"
"Bug Tracker" = "https://github.com/ReneeQRDu/scedyn/issues"
Changelog = "https://github.com/ReneeQRDu/scedyn/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=6"]
docs = [
    "sphinx>=7",
    "myst-parser>=2",
    "numpydoc>=1.6",
    "furo>=2023.08.17",
]
dev = [
    { include-group = "test" },
]

[tool.hatch.version]
path = "src/scedyn/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/_build"]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]


[tool.mypy]
files = ["src"]
python_version = "3.10"
warn_unused_configs = true
strict = false
check_untyped_defs = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
ignore_missing_imports = true


[tool.ruff.lint]
extend-select = [
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "NPY",  # NumPy specific rules
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
]
ignore = [
    "PLR09",    # too many arguments / branches / statements: the estimator exposes every tuning constant
    "PLR2004",  # magic values in comparisons
    "RUF001",   # ambiguous unicode characters in docstrings (Greek letters are intended)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"docs/conf.py" = ["INP001"]


[tool.codespell]
ignore-words-list = "te"
